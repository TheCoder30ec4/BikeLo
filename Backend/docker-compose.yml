services:

  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bikelo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - bikelo-network

  backend:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/bikelo
    command: /bin/sh -c "uv run python migrate.py && uv run python seed_admin.py && uv run uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4"
    depends_on:
      - postgres
    volumes:
      - uploads:/app/uploads
    expose:
      - "8000"
    networks:
      - bikelo-network

  nginx:
    image: nginx:latest
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bikelo-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    networks:
      - bikelo-network

volumes:
  postgres_data:
  uploads:

networks:
  bikelo-network: